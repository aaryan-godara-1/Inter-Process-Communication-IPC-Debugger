            }
            createEdge(pid, nodeId, 'request');
          }
          removeEdge(nodeId, pid, 'allocation');
        }

        logEvent(`${nodeId} set to ${resource.kind} (capacity ${resource.capacity})`, 'info', [nodeId], false, true);
      }

      detectDeadlock();
      updateStats();
    }

    function recoverDeadlock() {
      if (!deadlockState.active || !deadlockState.nodes.length) {
        logEvent('No active deadlock to recover.', 'info', [], false, true);
        return;
      }

      const cycleProcesses = deadlockState.nodes.filter((id) => id.startsWith('P') && processes[id]);
      if (!cycleProcesses.length) {
        logEvent('Deadlock recovery skipped: no process in cycle.', 'info', [], false, true);
        return;
      }

      const victim = cycleProcesses.sort((a, b) => {
        const ah = processes[a].holding.size;
        const bh = processes[b].holding.size;
        if (bh !== ah) {
          return bh - ah;
        }
        return b.localeCompare(a);
      })[0];

      const held = Array.from(processes[victim].holding);
      if (!held.length) {
        logEvent(`Recovery selected ${victim}, but it holds no resources.`, 'info', [victim], false, true);
        return;
      }

      held.forEach((rid) => releaseResource(rid, victim));
      logEvent(`Recovery: released ${held.join(', ')} from ${victim}`, 'info', [victim, ...held], false, true);
      detectDeadlock();
      updateStats();
    }

    function applyPresetDeadlock() {
      resetSimulation();
      const p1 = addProcess();
      const p2 = addProcess();
      const r1 = addResource();
      const r2 = addResource();

      // Build the final cycle directly so preset state is deterministic.
      allocateResource(r1, p1);
      allocateResource(r2, p2);
      requestResource(p1, r2);
      requestResource(p2, r1);
      detectDeadlock();
      logEvent('Loaded preset: deadlock cycle.', 'info', [p1, p2, r1, r2], false, true);
    }

    function applyPresetSafe() {
      resetSimulation();
      const p1 = addProcess();
      const p2 = addProcess();
      const r1 = addResource();
      const r2 = addResource();

      allocateResource(r1, p1);
      allocateResource(r2, p2);
      releaseResource(r1, p1);
      releaseResource(r2, p2);
      detectDeadlock();
      logEvent('Loaded preset: safe scenario.', 'info', [p1, p2, r1, r2], false, true);
    }

    function seedInitialGraph() {
      if (processIds.length > 0 || resourceIds.length > 0) {
        return;
      }

      const p1 = addProcess();
      const p2 = addProcess();
      const r1 = addResource();
      const r2 = addResource();

      // Minimal starter topology so graph is visible immediately.
      allocateResource(r1, p1);
      queueRequest(p2, r1);
      queueRequest(p1, r2);
      refreshViewport();
      updateStats();
    }

    function saveCurrentProfile() {
      const name = (els.profileInput.value || '').trim() || 'default';
      const profiles = loadProfiles();
      profiles[name] = {
        savedAt: Date.now(),
        state: cloneSerializableState()
      };
      saveProfiles(profiles);
      refreshProfileSelect();
      els.profileSelect.value = name;
      logEvent(`Profile saved: ${name}`, 'info', [], false, true);
    }

    function loadSelectedProfile() {
      const name = (els.profileSelect.value || '').trim() || (els.profileInput.value || '').trim();
      if (!name) {
        return;
      }

      const profiles = loadProfiles();
      if (!profiles[name] || !profiles[name].state) {
        logEvent(`Profile not found: ${name}`, 'info', [], false, true);
        return;
      }

      restoreSerializedState(profiles[name].state);
      logEvent(`Profile loaded: ${name}`, 'info', [], false, true);
    }

    function deleteSelectedProfile() {
      const name = (els.profileSelect.value || '').trim();
      if (!name) {
        return;
      }
      const profiles = loadProfiles();
      delete profiles[name];
      saveProfiles(profiles);
      refreshProfileSelect();
      logEvent(`Profile deleted: ${name}`, 'info', [], false, true);
    }

    function exportLogsAndState() {
      const payload = {
        exportedAt: new Date().toISOString(),
        logs: eventLog,
        snapshot: cloneSerializableState()
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ipc-debugger-export-${Date.now()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      logEvent('Exported logs and current snapshot.', 'info', [], false, true);
    }

    cy.on('cxttapstart', 'node', (evt) => {
      beginConnection(evt.target.id());
    });

    cy.on('mousemove', (evt) => {
      if (!connectState.active) {
        return;
      }
      updateConnection(evt.renderedPosition);
    });

    cy.on('cxttapend', () => {
      finishConnection();
    });

    cy.on('tap', 'node', (evt) => {
      if (liveModeActive) {
        return;
      }

      if (connectState.active) {
        return;
      }

      const node = evt.target;
      selectedNodeId = node.id();
      clearSelectedEdge();

      if (!selectedSourceNodeId) {
        selectedSourceNodeId = node.id();
        clearConnectionClasses();
        node.addClass('connect-source');
        return;
      }

      if (selectedSourceNodeId === node.id()) {
        clearSelectedSource();
        return;
      }

      applyConnection(selectedSourceNodeId, node.id());
      clearSelectedSource();
      clearConnectionClasses();
    });

    cy.on('dbltap', 'node', (evt) => {
      if (liveModeActive) {
        return;
      }
      editNodeProperties(evt.target.id());
    });

    cy.on('tap', 'edge', (evt) => {
      if (liveModeActive) {
        return;
      }

      if (connectState.active) {
        return;
      }

      clearSelectedSource();
      clearConnectionClasses();
      clearHighlights();
      clearSelectedEdge();

      selectedEdgeId = evt.target.id();
      evt.target.addClass('highlighted');
      logEvent(`Edge selected: ${selectedEdgeId}. Press Delete/Backspace to remove.`, 'info', [selectedEdgeId]);
    });

    cy.on('mouseover', 'node', (evt) => {
      const n = evt.target;
      const pos = n.renderedPosition();
      showTooltip(tooltipTextForNode(n.id()), pos);
    });

    cy.on('mousemove', 'node', (evt) => {
      const pos = evt.target.renderedPosition();
      showTooltip(tooltipTextForNode(evt.target.id()), pos);
    });

    cy.on('mouseout', 'node', () => {
      hideTooltip();
    });

    cy.on('tap', (evt) => {
      if (simulationActive && evt.target === cy) {
        const now = Date.now();
        if (now - lastStepAt >= clickStepDelayMs) {
          lastStepAt = now;
          stepSimulation();
        }
      }

      if (evt.target === cy) {
        clearSelectedSource();
        clearConnectionClasses();
        clearSelectedEdge();
        selectedNodeId = null;
      }
      clearHighlights();
    });

    document.addEventListener('keydown', (evt) => {
      if (evt.key === 'Escape') {
        cancelConnection();
        clearSelectedSource();
        clearConnectionClasses();
        clearSelectedEdge();
        hideTooltip();
      }

      if (evt.key === 'Delete' || evt.key === 'Backspace') {
        if (selectedEdgeId) {
          removeSelectedEdge();
        } else if (selectedNodeId || selectedSourceNodeId) {
          removeNode(selectedNodeId || selectedSourceNodeId);
        }
      }

      if (evt.key.toLowerCase() === 'r' && !evt.repeat) {
        runSimulation();
      }

      if (evt.key.toLowerCase() === 's' && !evt.repeat) {
        stepSimulation();
      }

      if (evt.key.toLowerCase() === 't' && !evt.repeat) {
        els.drawer.classList.toggle('open');
      }

      if (evt.key.toLowerCase() === 'k' && !evt.repeat) {
        recoverDeadlock();
      }

    });

    els.addProcess.addEventListener('click', addProcess);
    els.addResource.addEventListener('click', addResource);
    els.run.addEventListener('click', runSimulation);
    els.reset.addEventListener('click', resetSimulation);
    els.tools.addEventListener('click', () => {
      els.drawer.classList.toggle('open');
    });

    els.saveProfile.addEventListener('click', saveCurrentProfile);
    els.loadProfile.addEventListener('click', loadSelectedProfile);
    els.deleteProfile.addEventListener('click', deleteSelectedProfile);
    els.exportLogs.addEventListener('click', exportLogsAndState);
    els.liveMode.addEventListener('click', () => setLiveMode(!liveModeActive));
    els.recoverDeadlock.addEventListener('click', recoverDeadlock);
    els.presetCycle.addEventListener('click', applyPresetDeadlock);
    els.presetSafe.addEventListener('click', applyPresetSafe);

    els.schedulerSelect.addEventListener('change', () => {
      simPolicy.scheduler = els.schedulerSelect.value;
      logEvent(`Scheduler set to ${simPolicy.scheduler}`, 'info', [], false, true);
      updateStats();
    });

    els.speedRange.addEventListener('input', () => {
      simIntervalMs = Math.max(250, Number(els.speedRange.value) || 1000);
      if (simulationActive && simulationTimer) {
        clearInterval(simulationTimer);
        simulationTimer = setInterval(() => {
          simulationTick();
        }, simIntervalMs);
      }
      updateStats();
    });

    els.profileSelect.addEventListener('change', () => {
      if (els.profileSelect.value) {
        els.profileInput.value = els.profileSelect.value;
      }
    });

    cy.on('pan zoom resize', () => {
      if (connectState.active) {
        const sourceNode = cy.getElementById(connectState.sourceNodeId);
        if (sourceNode.length) {
          const rendered = sourceNode.renderedPosition();
          setPreviewLine(rendered.x, rendered.y, rendered.x, rendered.y, true);
        }
      }
    });

    cy.ready(refreshViewport);

    setNarrationVisible(false);
    refreshProfileSelect();
    seedInitialGraph();
    connectLiveSocket();
    refreshNodeLabels();
    updateStats();
    logEvent('Ready. Add nodes and connect process/resource edges to simulate.', 'info', [], false);
    updateStats();
  </script>
</body>
</html>
